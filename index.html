<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="WR!TE — a local-first editor for poems and short stories, with live scansion, rhyme, and form analysis. Works offline."
    />
    <!-- Tints the mobile browser chrome to match the canvas. The in-app theme
         toggle is a data-attribute, which meta tags can't follow, so these
         track the OS preference — the common case. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f0ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1b20" />
    <title>WR!TE</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Decodes the path 404.html encoded into the query string, restoring
      // the real URL before React Router mounts.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
