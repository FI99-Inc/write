<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="WR!TE — a local-first workspace for poems, stories, and Ideas, with projects, versions, and writing tools. Works offline."
    />
    <meta name="theme-color" content="#2b2b23" />
    <script>
      // Apply saved appearance before the first painted frame.
      try {
        var appearance = JSON.parse(
          localStorage.getItem('sonnet5-settings') || '{}',
        ).theme
        document.documentElement.dataset.theme = [
          'olive',
          'dusk',
          'sand',
          'light',
          'dark',
        ].includes(appearance)
          ? appearance
          : 'olive'
      } catch (_) {
        document.documentElement.dataset.theme = 'olive'
      }
    </script>
    <title>WR!TE</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Decodes the path 404.html encoded into the query string, restoring
      // the real URL before React Router mounts.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
